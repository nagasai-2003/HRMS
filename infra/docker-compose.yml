# Local stack. `make db` starts only Postgres and Redis (the API and web run
# on your machine with live reload). `make up` runs everything in Docker.
# Ports are offset from Triad LMS so both can run at once.
name: hrms

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hrms-dev}
      POSTGRES_DB: hrms
    ports: ["5442:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms -d hrms"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6390:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    profiles: [full]
    build: ../backend
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8180"
      DATABASE_URL: postgres://hrms:${POSTGRES_PASSWORD:-hrms-dev}@postgres:5432/hrms?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      # The web container is the only proxy in front of the API here.
      TRUSTED_PROXIES: 172.16.0.0/12,127.0.0.1/32
    ports: ["8180:8180"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    profiles: [full]
    build: ../web
    environment:
      API_URL: http://api:8180
    ports: ["3100:3100"]
    depends_on: [api]

volumes:
  pgdata:
