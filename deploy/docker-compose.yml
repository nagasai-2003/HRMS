# Production: everything on one server. Only Caddy is reachable from outside
# (ports 80 and 443); it gets the HTTPS certificate by itself and sends /api
# to the Go API and everything else to the web app.
#
#   cd deploy && cp .env.example .env   # then fill it in
#   docker compose up -d --build
#
name: hrms-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: hrms
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [inside]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms -d hrms"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [inside]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ../backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8180"
      DATABASE_URL: postgres://hrms:${POSTGRES_PASSWORD}@postgres:5432/hrms?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      # Only Caddy may say who the visitor is (X-Forwarded-For).
      TRUSTED_PROXIES: 172.31.0.10/32
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # Used only by the one-time setup commands (seed).
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [inside]

  web:
    build: ../web
    restart: unless-stopped
    environment:
      API_URL: http://api:8180
    depends_on: [api]
    networks: [inside]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in deploy/.env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]
    networks:
      inside:
        ipv4_address: 172.31.0.10

networks:
  inside:
    ipam:
      config:
        - subnet: 172.31.0.0/24

volumes:
  pgdata:
  caddy_data:
  caddy_config:
